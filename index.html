<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#11161d">
<title>Race Day · Training and Nutrition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f7;--card:#fff;--card2:#e9edf1;--line:#d3dae1;--tx:#141b23;--tx2:#5d6b79;--tx3:#8794a1;--acc:#0d7d9e;--acc-t:#fff;--food:#a8651a;--win:#2b7f59;--warn:#b8463a;--shadow:0 1px 2px rgba(20,27,35,.07)}
@media (prefers-color-scheme:dark){:root{--bg:#11161d;--card:#1a222c;--card2:#232e3a;--line:#31404f;--tx:#e9eef3;--tx2:#93a3b2;--tx3:#6f8090;--acc:#49b8d8;--acc-t:#0e151c;--food:#e0a54a;--win:#5fbf8a;--warn:#e5705f;--shadow:none}}
html[data-theme="light"]{--bg:#f3f5f7;--card:#fff;--card2:#e9edf1;--line:#d3dae1;--tx:#141b23;--tx2:#5d6b79;--tx3:#8794a1;--acc:#0d7d9e;--acc-t:#fff;--food:#a8651a;--win:#2b7f59;--warn:#b8463a;--shadow:0 1px 2px rgba(20,27,35,.07)}
html[data-theme="dark"]{--bg:#11161d;--card:#1a222c;--card2:#232e3a;--line:#31404f;--tx:#e9eef3;--tx2:#93a3b2;--tx3:#6f8090;--acc:#49b8d8;--acc-t:#0e151c;--food:#e0a54a;--win:#5fbf8a;--warn:#e5705f;--shadow:none}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Archivo,system-ui,sans-serif;font-size:16px;line-height:1.45;padding-bottom:96px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.wrap{max-width:840px;margin:0 auto;padding:0 clamp(14px,3.5vw,24px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:3px}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.hrow{display:flex;align-items:center;gap:14px;padding:12px 0}
.cd b{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:600;letter-spacing:-.02em;display:block;line-height:1}
.cd i{font-style:normal;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);display:block;margin-top:3px}
.hmid{flex:1 1 auto;min-width:0}
.hmid .p{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:600}
.hmid .d{font-size:17px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:38px;height:38px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.tabs{max-width:840px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{padding:11px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--tx3);font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;border-top:2px solid transparent;margin-top:-1px}
.tab .g{font-size:16px;line-height:1}
.tab[aria-selected="true"]{color:var(--acc);border-top-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.card.flag{border-color:var(--warn)}
.chd{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}
.chd h2{font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;flex:1 1 auto}
.chd .r{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--tx2);font-weight:600}
.pad{padding:15px}
.sect{margin:26px 0 10px;display:flex;align-items:baseline;gap:10px}
.sect h2{font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
.sect span{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--tx3);margin-left:auto}
.hint{font-size:13px;color:var(--tx2);line-height:1.55}
.hint b{color:var(--tx)}
.pill{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;border-radius:3px;background:var(--card2);color:var(--tx2)}
.pill.acc{background:var(--acc);color:var(--acc-t)}
.pill.warn{background:var(--warn);color:#fff}
.pill.win{background:var(--win);color:#fff}
.row{display:flex;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line);align-items:flex-start;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row.on{background:var(--card2)}
.box{width:26px;height:26px;flex:0 0 auto;border:2px solid var(--line);border-radius:6px;display:grid;place-items:center;margin-top:1px}
.row.on .box{background:var(--win);border-color:var(--win)}
.box svg{width:14px;height:14px;stroke:#fff;stroke-width:3.4;fill:none;opacity:0}
.row.on .box svg{opacity:1}
.rbody{flex:1 1 auto;min-width:0}
.rt{font-size:15px;font-weight:600;line-height:1.3;display:block}
.row.on .rt{color:var(--tx2)}
.rx{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--acc);font-weight:600;margin-top:3px;display:block}
.rn{font-size:12.5px;color:var(--tx2);margin-top:4px;line-height:1.45;display:block}
.swp{padding:2px 15px 11px 53px;border-bottom:1px solid var(--line)}
.swp>button.lk{font-size:12px;color:var(--acc);font-weight:600}
.opt{display:block;width:100%;text-align:left;margin:5px 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-weight:500;background:var(--bg)}
.opt b{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:13px 15px}
.chip{font-size:12.5px;font-weight:600;padding:9px 13px;border-radius:20px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
.chip.on{background:var(--acc);color:var(--acc-t);border-color:var(--acc)}
.fadd{display:flex;flex-wrap:wrap;gap:8px;padding:0 15px 13px}
.fadd input{padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font-size:14px}
.fadd input.nm{flex:1 1 150px;min-width:120px}
.fadd input.num{width:74px;font-family:'IBM Plex Mono',monospace;text-align:right}
.mac{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}
.mac div{background:var(--card);padding:11px 6px;text-align:center}
.mac b{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;display:block}
.mac i{font-style:normal;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);display:block;margin-top:2px}
.bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;background:var(--acc);width:0}
.bar.g>i{background:var(--win)}
.wkhd{display:flex;align-items:center;gap:10px;width:100%;padding:12px 15px;text-align:left}
.wkno{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--tx3)}
.wkdt{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;flex:1 1 auto}
.mini{display:flex;gap:3px}
.mini i{width:9px;height:9px;border-radius:2px;background:var(--card2);display:block}
.mini i.t{background:var(--acc);opacity:.3} .mini i.t.done{opacity:1} .mini i.r{background:var(--line)}
.chev{color:var(--tx3);font-size:11px}
.wkhd[aria-expanded="true"] .chev{transform:rotate(90deg)}
.dayrow{display:flex;gap:11px;align-items:center;padding:10px 15px;border-top:1px solid var(--line);width:100%;text-align:left}
.dd{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--tx3);width:56px;flex:0 0 auto}
.dl{flex:1 1 auto;font-size:14px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl.rest{font-weight:400;color:var(--tx2)}
.dk{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--tx3)}
.fi{padding:13px 15px;border-bottom:1px solid var(--line)}
.fi:last-child{border-bottom:0}
.fi-hd{display:flex;gap:10px;align-items:baseline}
.fi-hd b{font-size:14.5px;font-weight:600;flex:1 1 auto}
.fi-hd span{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--tx3);white-space:nowrap}
.fi-b{font-size:13px;color:var(--tx2);margin-top:5px;line-height:1.5}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}
.stat div{background:var(--card);padding:15px 8px;text-align:center}
.stat b{font-family:'IBM Plex Mono',monospace;font-size:25px;font-weight:600;display:block;line-height:1}
.stat i{font-style:normal;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);display:block;margin-top:6px}
.phrow{padding:13px 15px;border-bottom:1px solid var(--line)}
.phrow:last-child{border-bottom:0}
.phrow .t{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;font-weight:600;gap:10px}
.phrow .t span{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--tx3);font-weight:400;white-space:nowrap}
.inp{display:flex;align-items:center;gap:12px;padding:11px 15px;border-bottom:1px solid var(--line)}
.inp label{flex:1 1 auto;font-size:14px;font-weight:500}
.inp label small{display:block;font-size:11.5px;color:var(--tx3);font-weight:400;margin-top:2px}
.inp input{width:88px;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;text-align:right}
.ref{padding:13px 15px;border-bottom:1px solid var(--line)}
.ref:last-child{border-bottom:0}
.ref b{font-size:14px;font-weight:600;display:block}
.ref cite{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--tx3);font-style:normal;display:block;margin-top:3px}
.ref p{font-size:13px;color:var(--tx2);margin-top:6px;line-height:1.55}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

var LB=0.45359237;
function fatMassLb(){return ME.weightLb*ME.bodyFatPct/100;}
function ffmLb(){return ME.weightLb-fatMassLb();}
function ffmKg(){return ffmLb()*LB;}
function bmr(){return Math.round(370+21.6*ffmKg());}
function targetWeightLb(){return ffmLb()/(1-CFG.goalBodyFatPct/100);}
function fatToLoseLb(){return Math.max(0,ME.weightLb-targetWeightLb());}
function neatFactor(){return ME.activity;}
function pinnedEEE(day){
  if(day.kind==="race")return EEE.race;
  if(day.kind==="run"){if(day.rtype==="spd")return EEE.spd;if(day.rtype==="tmp")return EEE.tmp;if(day.rtype==="shake")return EEE.shake;return SIMWK.indexOf(day.w)>-1?EEE.sim:EEE.lng;}

}

function eeeFor(day){var wv=+watchK[day.iso]||0; if(wv>0)return wv; return pinnedEEE(day)+loggedEEE(day.iso);}
function maintenanceFor(day){return Math.round(bmr()*neatFactor()+eeeFor(day));}
function deficitEndsWeek(){return Math.min(CFG.deficitEndWeek,Math.max(1,weeksToGoal()));}
function inDeficit(day){return day.w<=deficitEndsWeek();}
function dailyDeficit(){return Math.round(reqDeficit(ME.goalWeeks));}
function eaFloorKcal(day){return Math.round(CFG.eaFloor*ffmKg()+eeeFor(day));}
function maxSafeDeficit(){return Math.max(0,Math.round(bmr()*neatFactor()-CFG.eaFloor*ffmKg()));}

function kcalFor(day){var m=maintenanceFor(day);var t=inDeficit(day)?Math.max(m-dailyDeficit(),eaFloorKcal(day)):m;return Math.round(t/10)*10;}
function proteinTarget(){return Math.round(ffmKg()*2.6);}
function energyAvail(day){var f=ffmKg(); if(!f)return 0; return Math.round((kcalFor(day)-eeeFor(day))/f);}
function scanFat(s){return s.w*s.bf/100;}

function lbPerWk(){return deficitApplied()*7/3500;}
function ratePct(){return ME.weightLb>0?lbPerWk()/ME.weightLb*100:0;}
function reqDeficit(wks){return wks>0?fatToLoseLb()*3500/(wks*7):0;}

        var soft=(d.kind==="rest");
        h+='<button class="dayrow" data-go="'+d.i+'"><span class="dd">'+d.date.toLocaleDateString(undefined,{weekday:"short",day:"numeric"})+'</span>'+
        '<span class="dl'+(soft?" rest":"")+'">'+esc(d.title)+'</span><span class="dk">'+kcalFor(d)+'</span></button>';});
      h+='</div>';
    }
  });
  return h;
}
function viewFood(){
  var avg=recentAvg();
  var h='<div class="card"><div class="chd"><h2>Track the average, not the day</h2></div><div class="pad">'+
   '<p class="hint">One day tells you almost nothing. The rolling average of what you actually eat is the number that moves the scale. Check the meals you ate, swap the ones you did not, and write in anything off the list. '+
   (avg?'<b>Right now your last '+avg.n+' logged days average '+avg.k+' kcal and '+avg.p+' g protein.</b>':'Log a few days to see your rolling average here.')+'</p>'+
   '<p class="hint" style="margin-top:9px">Protein target holds at '+proteinTarget()+' g. Daily calorie target moves with your training. The deficit is '+dailyDeficit()+' kcal and ends at week '+CFG.deficitEndWeek+'. Nothing here asks you to hit a number perfectly.</p></div></div>';
  h+='<div class="card"><div class="chd"><h2>Targets by phase</h2></div>';
  PHASES.forEach(function(p){
    var sample=DAYS.filter(function(d){return d.ph===p;});
    var r=sample.filter(function(d){return d.kind==="rest";})[0]||sample[0];
    var tr=sample.filter(function(d){return isTrain(d.kind);})[0]||sample[0];
    h+='<div class="phrow"><div class="t">'+p.n+'<span>'+(r?kcalFor(r):"-")+' rest · '+(tr?kcalFor(tr):"-")+' training</span></div>'+
     '<p class="hint" style="margin-top:4px">'+p.note+'</p></div>';
  });
  h+='</div>';
  h+='<div class="sect"><h2>Weekly prep, about an hour on Sunday</h2></div><div class="card">';
  PREP.forEach(function(p){h+='<div class="fi"><div class="fi-hd"><b>'+p+'</b></div></div>';});
  h+='</div>';
  [["Breakfast",B],["Lunch",L],["Dinner",D],["Snacks",S]].forEach(function(g){
    h+='<div class="sect"><h2>'+g[0]+'</h2><span>'+g[1].length+' options</span></div><div class="card">';
    g[1].forEach(function(m){h+='<div class="fi"><div class="fi-hd"><b>'+esc(m.n)+'</b><span>'+m.k+' kcal · '+m.p+'P '+m.c+'C '+m.f+'F</span></div>'+
      (m.d?'<p class="fi-b">'+esc(m.d)+'</p>':'')+(m.pr?'<p class="fi-b" style="color:var(--food)">'+esc(m.pr)+'</p>':'')+'</div>';});
    h+='</div>';
  });
  h+='<div class="card"><div class="pad"><p class="hint"><b>Not on the list?</b> On the Today tab, use "Write in your own food" to log anything with a rough calorie and protein number. That includes the nighttime sweets. Logging them honestly is what keeps the average real, and the average is what you are actually managing.</p></div></div>';
  return h;
}
function viewProg(){
  var t=todayD(), idx=DAYS.indexOf(t);
  var tr=DAYS.filter(function(d){return isTrain(d.kind);});
  var past=tr.filter(function(d){return d.date<=t.date;});
  var donePast=past.filter(function(d){return workoutFor(d).every(function(x,i){return state["w-"+d.iso+"-"+i];});});
  var doneAll=tr.filter(function(d){return workoutFor(d).every(function(x,i){return state["w-"+d.iso+"-"+i];});});
  var extraCount=0; Object.keys(acts).forEach(function(k){extraCount+=(acts[k]||[]).length;});
  var streak=0;
  for(var i=idx;i>=0;i--){var d=DAYS[i];if(!isTrain(d.kind))continue;
    if(workoutFor(d).every(function(x,j){return state["w-"+d.iso+"-"+j];}))streak++;else break;}
  var avg=recentAvg();
  var h='<div class="card"><div class="chd"><h2>Your numbers</h2>'+(ME.set?'':'<span class="pill warn">Not set</span>')+'</div>'+
   '<div class="inp"><label>Bodyweight<small>pounds</small></label><input type="number" id="iW" value="'+ME.weightLb+'" step="0.5"></div>'+
   '<div class="inp"><label>Height<small>inches</small></label><input type="number" id="iH" value="'+ME.heightIn+'" step="0.5"></div>'+
   '<div class="inp"><label>Body fat<small>percent, an estimate is fine</small></label><input type="number" id="iF" value="'+ME.bodyFatPct+'" step="0.5"></div>'+
   '<div class="inp"><label>Skeletal muscle mass<small>pounds, from InBody. Tracked, not used in targets.</small></label><input type="number" id="iS" value="'+ME.smmLb+'" step="0.1"></div>'+
   '<div class="inp"><label>Activity factor<small>1.35 desk, 1.45 on your feet, 1.55 physical job. Sessions add on top.</small></label><input type="number" id="iA" value="'+ME.activity+'" step="0.05"></div>'+
   '<div class="inp"><label>Timeline you want<small>weeks to reach '+CFG.goalBodyFatPct+'%</small></label><input type="number" id="iG" value="'+ME.goalWeeks+'" step="1"></div>'+
   '<div class="pad"><button class="pill acc" style="padding:11px 18px;font-size:11px;width:100%" data-save="1">'+(ME.set?"Numbers saved. Update anytime.":"Save these numbers")+'</button></div>'+
   '<div class="pad" style="border-top:1px solid var(--line)"><p class="hint">Fat mass '+fatMassLb().toFixed(1)+' lb. Fat-free mass '+ffmLb().toFixed(1)+' lb ('+ffmKg().toFixed(1)+' kg). BMR '+bmr()+' kcal. Protein target '+proteinTarget()+' g. Applied deficit '+deficitApplied()+' kcal, about '+lbPerWk().toFixed(2)+' lb per week.</p></div></div>';
  h+='<div class="card"><div class="chd"><h2>Intake averages</h2><span class="r">'+(avg?avg.n+' days':'no data')+'</span></div><div class="pad">'+
   (avg?'<div class="mac" style="margin:-15px -15px 12px;border-top:1px solid var(--line)"><div><b>'+avg.k+'</b><i>avg kcal in</i></div><div><b>'+avg.p+'g</b><i>avg protein</i></div><div><b>'+proteinTarget()+'g</b><i>protein target</i></div></div>'+
   '<p class="hint">Averaged over your last '+avg.n+' logged days. This is the number to steer by. If the scale trend and this average disagree with the plan over three weeks, adjust the activity factor rather than white-knuckling a single day.</p>':'<p class="hint">Check meals and write in foods on the Today tab for a few days and your rolling average appears here.</p>')+'</div></div>';
  var sc=sortedScans();
  h+='<div class="card"><div class="chd"><h2>Body composition</h2><span class="r">'+sc.length+' scan'+(sc.length===1?'':'s')+'</span></div>'+
   '<div class="pad"><p class="hint">Press log after each InBody. It snapshots the three fields above, so update those first.</p>'+
   '<button class="pill acc" style="padding:11px 18px;font-size:11px;width:100%;margin-top:11px" data-scan="add">Log today\'s measurement</button></div>';
  if(sc.length>1){
    var a=sc[0],b=sc[sc.length-1];var fatCh=scanFat(b)-scanFat(a), smmCh=b.smm-a.smm;
    h+='<div class="pad" style="border-top:1px solid var(--line)"><p class="hint">Across '+sc.length+' scans, fat mass '+(fatCh<0?'down':'up')+' '+Math.abs(fatCh).toFixed(1)+' lb, skeletal muscle '+(smmCh<0?'down':'up')+' '+Math.abs(smmCh).toFixed(1)+' lb. '+
     (fatCh<0&&smmCh>=0?'<b style="color:var(--win)">That is a recomposition.</b>':'')+'</p></div>';
  }
  h+='</div>';
  h+='<div class="card"><div class="stat">'+
   '<div><b>'+Math.max(0,Math.ceil((RACE-new Date())/864e5))+'</b><i>days out</i></div>'+
   '<div><b>'+streak+'</b><i>session streak</i></div>'+
   '<div><b>'+(past.length?Math.round(donePast.length/past.length*100):0)+'%</b><i>sessions hit</i></div></div></div>';
  h+='<div class="card"><div class="chd"><h2>Weekly weigh in</h2><span class="r">Sundays</span></div><div class="pad">'+
   '<p class="hint">One weight per week, same time and conditions. Read the three week trend.</p></div>';
  for(var w=1;w<=Math.min(20,t.w+1);w++){
    h+='<div class="inp"><label>Week '+w+'<small>'+DAYS.filter(function(d){return d.w===w;})[0].date.toLocaleDateString(undefined,{month:"short",day:"numeric"})+'</small></label>'+
     '<input type="number" step="0.1" data-wt="'+w+'" value="'+(weights[w]||"")+'" placeholder="lb"></div>';
  }
  h+='</div>';
  h+='<div class="card"><div class="chd"><h2>Training completion</h2><span class="r">'+doneAll.length+' / '+tr.length+'</span></div>'+
   '<div class="pad"><div class="bar"><i style="width:'+(doneAll.length/tr.length*100)+'%"></i></div>'+
   '<p class="hint" style="margin-top:9px">'+donePast.length+' of '+past.length+' run and strength sessions done so far, plus '+extraCount+' classes or extras logged.</p></div></div>';
  h+='<div class="card"><div class="chd"><h2>Sync across devices</h2>'+
   '<span class="pill '+(cfgd()?(live?"win":"warn"):"")+'">'+(cfgd()?(live?"Connected":"Not reaching"):"Solo mode")+'</span></div>'+
   '<div class="pad"><p class="hint">'+
   (cfgd()?(live?"Connected. Your checks follow you between devices. <b>Anything ticked here is readable by anyone with this site URL.</b>":"Keys saved but the database is not responding. Still saving to this browser."):"Right now everything saves to this browser only.")+'</p></div>'+
   '<div class="inp"><label>Supabase URL<small>https://yourproject.supabase.co</small></label></div>'+
   '<div class="pad" style="padding-top:0"><input type="text" id="sbU" value="'+esc(SYNC.url)+'" placeholder="https://....supabase.co" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font-family:\'IBM Plex Mono\',monospace;font-size:13px"></div>'+
   '<div class="inp"><label>Anon public key<small>safe in a browser</small></label></div>'+
   '<div class="pad" style="padding-top:0"><input type="text" id="sbK" value="'+esc(SYNC.key)+'" placeholder="eyJhbGci..." style="width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font-family:\'IBM Plex Mono\',monospace;font-size:13px"></div>'+
   '<div class="pad" style="display:flex;gap:8px"><button class="pill acc" style="padding:11px 18px;font-size:11px;flex:1" data-sync="save">Connect</button>'+
   (cfgd()?'<button class="pill" style="padding:11px 18px;font-size:11px;border:1px solid var(--line)" data-sync="clear">Disconnect</button>':'')+'</div></div>';
  return h;
}
function viewWhy(){
  var h='<div class="card"><div class="pad"><p class="hint">Every prescription traces to something below. The training is built around your Dec 9 doubles race with Justine, and around a week you will actually repeat.</p></div></div>';
  h+='<div class="card">';
  REFS.forEach(function(r){h+='<div class="ref"><b>'+esc(r.t)+'</b><cite>'+esc(r.c)+'</cite><p>'+esc(r.p)+'</p></div>';});
  h+='</div>';
  h+='<div class="card"><div class="pad"><p class="hint"><b>The week at a glance.</b> Monday push, Wednesday pull, Friday lower, each with a 30 min incline walk. Tuesday speed, Thursday tempo, Saturday long or brick. Sunday is a true rest day, mobility and light yoga only. Swap a run for GTX, or add pilates, barre or pickleball on any day from the Today tab. The Saturday brick is where the race gets specific, running into a station tired.</p>'+
   '<p class="hint" style="margin-top:9px"><b>Limits worth knowing.</b> Body fat from anything but DEXA carries error that flows into the calorie math, so the weigh-in trend and your intake average are what validate it. Session costs are estimates. Adjust the activity factor, not your willpower, if the numbers drift for three weeks.</p></div></div>';
  return h;
}
function render(){
  var t=todayD(), day=focus||t;
  document.getElementById("cdN").textContent=Math.max(0,Math.ceil((RACE-new Date())/864e5));
  document.getElementById("hPhase").textContent=day.ph.n+" · Week "+day.w;
  document.getElementById("hDate").textContent=fmt(day.date);
  document.getElementById("view").innerHTML=
   curView==="today"?viewToday():curView==="plan"?viewPlan():curView==="food"?viewFood():curView==="prog"?viewProg():viewWhy();
}
function syncTabs(){[].forEach.call(document.querySelectorAll(".tab"),function(t){t.setAttribute("aria-selected",t.dataset.v===curView);});}
function curDay(){return focus||todayD();}
document.addEventListener("click",function(e){
  var c=e.target.closest("[data-ck]");
  if(c){var id=c.dataset.ck,on=!state[id];if(on)state[id]=true;else delete state[id];lsSet();push(id,on);render();return;}
  var so=e.target.closest("[data-swapopen]"); if(so){swapOpen=so.dataset.swapopen;render();return;}
  var sc3=e.target.closest("[data-swapclose]"); if(sc3){swapOpen=null;render();return;}
  var sr=e.target.closest("[data-swapreset]"); if(sr){var rk=sr.dataset.swapreset;delete swaps[rk];delete mealCust[rk];var rs=rk.slice(-1),ri=rk.slice(0,rk.length-2);delete state["m-"+ri+"-c"+rs];swapOpen=null;lsSet();render();return;}
  var sw=e.target.closest("[data-swap]"); if(sw){var pr=sw.dataset.swap.split("::");swaps[pr[0]]=pr[1];delete mealCust[pr[0]];swapOpen=null;lsSet();render();return;}
  var mw=e.target.closest("[data-mwrite]"); if(mw){var mk=mw.dataset.mwrite;var mn=(document.getElementById("mN").value||"").trim();var mkc=parseFloat(document.getElementById("mK").value);var mpp=parseFloat(document.getElementById("mP").value);
    if(mkc>0){mealCust[mk]={n:mn||"Write-in",k:Math.round(mkc),p:mpp>0?Math.round(mpp):0};delete swaps[mk];var ms=mk.slice(-1),mi=mk.slice(0,mk.length-2);state["m-"+mi+"-c"+ms]=true;swapOpen=null;lsSet();render();}return;}
  var xo=e.target.closest("[data-xopen]"); if(xo){exOpen=xo.dataset.xopen;render();return;}
  var xc=e.target.closest("[data-xclose]"); if(xc){exOpen=null;render();return;}
  var xr=e.target.closest("[data-xreset]"); if(xr){delete xsw[xr.dataset.xreset];exOpen=null;lsSet();render();return;}
  var xs=e.target.closest("[data-xsw]"); if(xs){var xp=xs.dataset.xsw.split("::");var alt=(SUBS[xp[0]]||[])[+xp[1]];if(alt)xsw[xp[0]]={n:alt.n,x:alt.x,c:alt.c||""};exOpen=null;lsSet();render();return;}
  var xw=e.target.closest("[data-xswwrite]"); if(xw){var xk=xw.dataset.xswwrite;var xn=(document.getElementById("xN").value||"").trim();var xx=(document.getElementById("xX").value||"").trim();if(xn)xsw[xk]={n:xn,x:xx||"your call",c:"Your write-in."};exOpen=null;lsSet();render();return;}
  var sno=e.target.closest("[data-snackopen]"); if(sno){snackOpen=true;render();return;}
  var snc=e.target.closest("[data-snackclose]"); if(snc){snackOpen=false;render();return;}
  var sna=e.target.closest("[data-snackadd]"); if(sna){var sk=curDay().iso;snackPick[sk]=snackPick[sk]||[];snackPick[sk].push(sna.dataset.snackadd);lsSet();render();return;}
  var snr=e.target.closest("[data-snackrm]"); if(snr){var sk2=curDay().iso;if(snackPick[sk2]){snackPick[sk2].splice(+snr.dataset.snackrm,1);if(!snackPick[sk2].length)delete snackPick[sk2];}lsSet();render();return;}
  var snw=e.target.closest("[data-snackwrite]"); if(snw){var sk3=curDay().iso;var snn=(document.getElementById("snN").value||"").trim();var snk=parseFloat(document.getElementById("snK").value);var snp=parseFloat(document.getElementById("snP").value);
    if(snk>0){foods[sk3]=foods[sk3]||[];foods[sk3].push({n:snn||"Snack",k:Math.round(snk),p:snp>0?Math.round(snp):0});lsSet();render();}return;}
  var ao=e.target.closest("[data-addopen]"); if(ao){addOpen=true;render();return;}
  var ac=e.target.closest("[data-addclose]"); if(ac){addOpen=false;render();return;}
  var aa=e.target.closest("[data-actadd]"); if(aa){var k=curDay().iso;acts[k]=acts[k]||[];if(acts[k].indexOf(aa.dataset.actadd)<0)acts[k].push(aa.dataset.actadd);lsSet();render();return;}
  var ar=e.target.closest("[data-actrm]"); if(ar){var k2=curDay().iso;acts[k2]=(acts[k2]||[]).filter(function(x){return x!==ar.dataset.actrm;});lsSet();render();return;}
  var fo=e.target.closest("[data-foodopen]"); if(fo){addFood=true;render();return;}
  var fca=e.target.closest("[data-foodcancel]"); if(fca){addFood=false;render();return;}
  var fa=e.target.closest("[data-foodadd]");
  if(fa){var k3=curDay().iso;var nm=(document.getElementById("fcN").value||"").trim();
    var kk=parseFloat(document.getElementById("fcK").value);var pp=parseFloat(document.getElementById("fcP").value);
    if(kk>0){foods[k3]=foods[k3]||[];foods[k3].push({n:nm||"Food",k:Math.round(kk),p:pp>0?Math.round(pp):0});addFood=false;lsSet();render();}
    return;}
  var frm=e.target.closest("[data-foodrm]"); if(frm){var k4=curDay().iso;var ix=+frm.dataset.foodrm;if(foods[k4]){foods[k4].splice(ix,1);if(!foods[k4].length)delete foods[k4];}lsSet();render();return;}
  var mo=e.target.closest("[data-moveopen]"); if(mo){moveOpen=true;render();return;}
  var mvc=e.target.closest("[data-moveclose]"); if(mvc){moveOpen=false;render();return;}
  var mv=e.target.closest("[data-move]"); if(mv){swapDays(curDay().iso,mv.dataset.move);moveOpen=false;lsSet();render();return;}
  var w=e.target.closest("[data-wk]"); if(w){var n=+w.dataset.wk;openWk=(openWk===n?-1:n);render();return;}
  var g=e.target.closest("[data-go]"); if(g){focus=DAYS[+g.dataset.go];curView="today";swapOpen=null;exOpen=null;snackOpen=false;addOpen=false;addFood=false;moveOpen=false;syncTabs();render();scrollTo(0,0);return;}
  var nv=e.target.closest("[data-nav]"); if(nv){var v=nv.dataset.nav;focus=(v==="today")?null:DAYS[+v];swapOpen=null;exOpen=null;snackOpen=false;addOpen=false;addFood=false;moveOpen=false;render();scrollTo(0,0);return;}
  var gt=e.target.closest("[data-goto]"); if(gt){curView=gt.dataset.goto;syncTabs();render();scrollTo(0,0);return;}
  var sc2=e.target.closest("[data-scan]");
  if(sc2){var v=sc2.dataset.scan;
    if(v==="add"){var td=iso(new Date());scans=(scans||[]).filter(function(x){return x.d!==td;});scans.push({d:td,w:ME.weightLb,bf:ME.bodyFatPct,smm:ME.smmLb});}
    else if(v.indexOf("del:")===0){var dd=v.slice(4);scans=(scans||[]).filter(function(x){return x.d!==dd;});}
    lsSet();render();return;}
  var sy=e.target.closest("[data-sync]");
  if(sy){
    if(sy.dataset.sync==="clear"){SYNC={url:"",key:""};live=false;lsSet();render();return;}
    var u=(document.getElementById("sbU").value||"").trim().replace(/\/$/,"");
    var kk2=(document.getElementById("sbK").value||"").trim();
    SYNC={url:u,key:kk2}; lsSet();
    if(cfgd())pull().then(function(){live=true;render();}).catch(function(){live=false;render();});
    else render();
    return;
  }
  var sv=e.target.closest("[data-save]");
  if(sv){var q=function(id){return parseFloat(document.getElementById(id).value);};
    var a=q("iW"),b=q("iH"),c2=q("iF"),d2=q("iA"),e2=q("iG"),f2=q("iS");
    if(a>0)ME.weightLb=a; if(b>0)ME.heightIn=b; if(c2>0&&c2<60)ME.bodyFatPct=c2;
    if(f2>0)ME.smmLb=f2; if(d2>=1.2&&d2<=1.9)ME.activity=d2; if(e2>0&&e2<=40)ME.goalWeeks=e2;
    ME.set=true; lsSet(); render(); return;}
  var tb=e.target.closest(".tab"); if(tb){curView=tb.dataset.v;swapOpen=null;exOpen=null;snackOpen=false;addOpen=false;addFood=false;moveOpen=false;syncTabs();render();scrollTo(0,0);return;}
  if(e.target.closest("#themeBtn")){
    var cu=document.documentElement.getAttribute("data-theme");
    var nx=cu==="dark"?"light":cu==="light"?"":"dark";
    if(nx)document.documentElement.setAttribute("data-theme",nx);else document.documentElement.removeAttribute("data-theme");
    try{localStorage.setItem("raceday-theme",nx);}catch(err){}
  }
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="iW"||t.id==="iH"||t.id==="iF"||t.id==="iA"||t.id==="iG"||t.id==="iS"){
    var g=function(id){return parseFloat(document.getElementById(id).value);};
    var vw=g("iW"),vh=g("iH"),vf=g("iF"),va=g("iA"),vg=g("iG"),vs=g("iS");
    if(vw>0)ME.weightLb=vw; if(vh>0)ME.heightIn=vh; if(vf>0&&vf<60)ME.bodyFatPct=vf;
    if(vs>0)ME.smmLb=vs; if(va>=1.2&&va<=1.9)ME.activity=va; if(vg>0&&vg<=40)ME.goalWeeks=vg;
    ME.set=true; lsSet(); render(); return;
  }
  if(t.dataset.watch){var wi=curDay().iso;var wv=parseFloat(t.value); if(wv>0)watchK[wi]=Math.round(wv); else delete watchK[wi]; lsSet(); render(); return;}
  if(t.dataset.wt){var v=parseFloat(t.value); if(v>0)weights[t.dataset.wt]=v; else delete weights[t.dataset.wt]; lsSet(); render();}
});
lsGet();
applyTrainOverrides();
try{var th=localStorage.getItem("raceday-theme");if(th)document.documentElement.setAttribute("data-theme",th);}catch(e){}
if(cfgd())pull().then(function(){render();setInterval(function(){pull().then(render).catch(function(){});},15000);}).catch(render);
else render();
setInterval(function(){document.getElementById("cdN").textContent=Math.max(0,Math.ceil((RACE-new Date())/864e5));},36e5);
